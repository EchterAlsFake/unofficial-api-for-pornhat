[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "unofficial-api-for-pornhat"
version = "0.1.0"
description = "An asynchronous Python API wrapper and scraper for pornhat.com"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "Johannes Habel", email = "EchterAlsFake@proton.me"}]
dependencies = ["eaf-base-api>=4.2.6", "selectolax", "m3u8"]

[project.scripts]
pornhat_api = "pornhat_api.api:main"

[tool.uv.build-backend]
module-name = "pornhat_api"
module-root = ""
source-include = ["docs/**", "MANIFEST.in"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "build", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: requires real public Pornhat requests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
